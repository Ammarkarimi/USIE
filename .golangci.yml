version: "2"
linters:
  default: standard
  settings:
    errcheck:
      # Best-effort cleanup whose failure cannot be acted on: closing readers,
      # removing temporary files, writing to an HTTP response that has
      # already started, or a buffered writer whose error is checked on flush.
      exclude-functions:
        - (io.Closer).Close
        - (io.ReadCloser).Close
        - (*os.File).Close
        - (*net/http.Server).Close
        - (*github.com/jackc/pgx/v5.Conn).Close
        - os.Remove
        - os.RemoveAll
        - io.Copy
        - fmt.Fprint
        - fmt.Fprintf
  exclusions:
    rules:
      # Test setup writes fixtures; a failure surfaces as a failed assertion.
      - path: _test\.go
        linters: [errcheck]
