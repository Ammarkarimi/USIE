[workspace]
resolver = "2"
members = ["intermediate-representation", "parser", "semantic", "cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.82"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tree-sitter = "0.27"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
rayon = "1"
proptest = "1"
usie-ir = { path = "intermediate-representation" }
usie-parser = { path = "parser" }
usie-semantic = { path = "semantic" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
panic = "abort"
