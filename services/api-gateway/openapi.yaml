                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid request."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Role does not permit this action, or the CSRF token is missing."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: "Not found (also returned for resources of other organizations)."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      parameters:
        - name: "id"
          in: "path"
          description: "Token id (UUID)."
          required: true
          schema:
            type: "string"
            format: "uuid"
      security:
        - session: []
        - token: []
      x-min-role: "viewer"
  "/workspaces":
    get:
      tags:
        - "Workspaces"
      summary: "List workspaces."
      description: "List workspaces."
      operationId: "get_workspaces"
      responses:
