  "/versions/{id}/impact":
    post:
      tags:
        - "Change impact"
      summary: "Impact of a change on this version: changed declarations, their dependents, the tests that reach them, and an explained risk score."
      description: |
        The change is given as node keys, whole files, a unified diff that applies to this version, a base version of the same repository (what changed since then), or any combination. Diff hunks map to the innermost declarations whose lines they touch. Dependents are found by following CALLS, INSTANTIATES, REFERENCES, EXTENDS, IMPLEMENTS and IMPORTS relationships backwards, keeping for each dependent the shortest path and the weakest confidence along it. The risk score is a weighted sum of the listed factors; it ranks changes and is not a probability of failure.
      operationId: "post_versions_id_impact"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              $ref: "#/components/schemas/ImpactRequest"
      responses:
        "200":
          description: "Impact analysis."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  version_id:
                    type: "string"
