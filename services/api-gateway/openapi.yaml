# USIE HTTP API contract. Every route registered by the gateway must appear
# here; services/api-gateway/api_test.go enforces that.
openapi: "3.0.3"
info:
  title: "USIE API"
  version: "0.1.0"
  description: "REST API of the Universal Software Intelligence Engine.\n\nAuthentication is either a session cookie (obtained from /auth/login; state-changing requests must also send the X-CSRF-Token header) or an API token sent as `Authorization: Bearer usie_\u2026`.\n\nAll resources are scoped to the caller's organization. Requests for resources that belong to another organization receive 404.\n\nErrors have the shape `{\"error\": {\"code\", \"message\", \"request_id\"}}`."
servers:
  - url: "/api/v1"
paths:
  "/system":
    get:
      tags:
        - "System"
      summary: "Installation information: version, feature status, enabled sources and limits."
      description: "Installation information: version, feature status, enabled sources and limits."
      operationId: "get_system"
      responses:
        "200":
          description: "System information."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/System"
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  "/openapi.yaml":
    get:
      tags:
        - "System"
      summary: "This document."
      description: "This document."
      operationId: "get_openapi_yaml"
      responses:
        "200":
          description: "OpenAPI document."
          content:
            "application/yaml":
              schema:
                type: "string"
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      security: []
  "/auth/register":
    post:
      tags:
        - "Authentication"
      summary: "Register a user and create their organization."
      description: "Register a user and create their organization. Subject to the installation's signup mode. Starts a session."
      operationId: "post_auth_register"
      responses:
        "200":
          description: "Session started."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid request."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                password:
                  type: "string"
                  minLength: 10
                  maxLength: 256
                display_name:
                  type: "string"
                organization:
                  type: "string"
              additionalProperties: false
              required:
                - "email"
                - "password"
                - "display_name"
                - "organization"
      security: []
  "/auth/login":
    post:
      tags:
        - "Authentication"
      summary: "Start a session."
      description: "Start a session. Sets an HttpOnly cookie and returns the CSRF token required for state-changing requests."
      operationId: "post_auth_login"
      responses:
        "200":
          description: "Session started."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid request."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                email:
                  type: "string"
                password:
                  type: "string"
              additionalProperties: false
              required:
                - "email"
                - "password"
      security: []
  "/auth/logout":
    post:
      tags:
        - "Authentication"
      summary: "End the current session."
      description: "End the current session."
      operationId: "post_auth_logout"
      responses:
        "204":
          description: "Signed out."
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Role does not permit this action, or the CSRF token is missing."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - session: []
        - token: []
      x-min-role: "viewer"
  "/auth/me":
    get:
      tags:
        - "Authentication"
      summary: "The authenticated principal."
      description: "The authenticated principal."
      operationId: "get_auth_me"
      responses:
        "200":
          description: "Principal."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Session"
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Role does not permit this action, or the CSRF token is missing."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - session: []
        - token: []
      x-min-role: "viewer"
  "/tokens":
    get:
      tags:
        - "API tokens"
      summary: "List the caller's API tokens."
      description: "List the caller's API tokens. Secrets are never returned."
      operationId: "get_tokens"
      responses:
        "200":
          description: "Tokens."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  tokens:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/ApiToken"
                additionalProperties: false
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Role does not permit this action, or the CSRF token is missing."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      security:
        - session: []
        - token: []
      x-min-role: "viewer"
    post:
      tags:
        - "API tokens"
      summary: "Create an API token."
      description: "Create an API token. Only available to session-authenticated callers. The secret is returned once."
      operationId: "post_tokens"
      responses:
        "201":
          description: "Token created."
          content:
            "application/json":
              schema:
                type: "object"
                properties:
                  token:
                    $ref: "#/components/schemas/ApiToken"
                  secret:
                    type: "string"
                additionalProperties: false
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "400":
          description: "Invalid request."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: "Authentication required."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: "Role does not permit this action, or the CSRF token is missing."
          content:
            "application/json":
              schema:
                $ref: "#/components/schemas/Error"
      requestBody:
        required: true
        content:
          "application/json":
            schema:
              type: "object"
              properties:
                name:
                  type: "string"
                role:
                  type: "string"
                  enum:
                    - "viewer"
                    - "member"
                    - "admin"
                expires_in_days:
                  type: "integer"
                  minimum: 0
                  maximum: 366
                  default: 0
              additionalProperties: false
              required:
                - "name"
                - "role"
      security:
        - session: []
        - token: []
      x-min-role: "viewer"
  "/tokens/{id}":
    delete:
      tags:
        - "API tokens"
      summary: "Revoke one of the caller's API tokens."
      description: "Revoke one of the caller's API tokens."
      operationId: "delete_tokens_id"
      responses:
        "204":
          description: "Revoked."
        "429":
          description: "Rate limit exceeded."
          content:
            "application/json":
