components:
  securitySchemes:
    session:
      type: "apiKey"
      in: "cookie"
      name: "usie_session"
    token:
      type: "http"
      scheme: "bearer"
  schemas:
    Error:
      type: "object"
      properties:
        error:
          type: "object"
          properties:
            code:
              type: "string"
            message:
              type: "string"
            request_id:
              type: "string"
          additionalProperties: false
      additionalProperties: false
    Principal:
      type: "object"
      properties:
        user_id:
          type: "string"
        email:
          type: "string"
        display_name:
          type: "string"
        organization_id:
          type: "string"
        organization_name:
          type: "string"
        role:
          type: "string"
          enum:
            - "owner"
            - "admin"
            - "member"
            - "viewer"
        kind:
          type: "string"
          enum:
            - "session"
            - "token"
      additionalProperties: false
    Session:
      type: "object"
      properties:
        principal:
          $ref: "#/components/schemas/Principal"
        csrf_token:
          type: "string"
          description: "Send as the X-CSRF-Token header on non-GET requests made with the session cookie."
      additionalProperties: false
    System:
      type: "object"
      properties:
        version:
          type: "string"
        signup_allowed:
          type: "boolean"
        features:
          type: "array"
          items:
            type: "object"
            properties:
              id:
                type: "string"
              status:
                type: "string"
                enum:
                  - "implemented"
                  - "experimental"
                  - "planned"
                  - "unsupported"
              detail:
                type: "string"
            additionalProperties: false
        sources:
          type: "object"
          additionalProperties: true
        limits:
          type: "object"
          additionalProperties: true
        engine:
          type: "object"
          nullable: true
          additionalProperties: true
      additionalProperties: false
    ApiToken:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        prefix:
          type: "string"
        role:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        last_used_at:
          type: "string"
          format: "date-time"
          nullable: true
        expires_at:
          type: "string"
          format: "date-time"
          nullable: true
        revoked_at:
          type: "string"
          format: "date-time"
          nullable: true
      additionalProperties: false
    Workspace:
      type: "object"
      properties:
        id:
          type: "string"
        name:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
      additionalProperties: false
    Repository:
      type: "object"
      properties:
        id:
          type: "string"
        workspace_id:
          type: "string"
        name:
          type: "string"
        source_kind:
          type: "string"
        source_location:
          type: "string"
        default_ref:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        latest_version:
          allOf:
            - $ref: "#/components/schemas/Version"
          nullable: true
      additionalProperties: false
    Version:
      type: "object"
      properties:
        id:
          type: "string"
        repository_id:
          type: "string"
        sequence:
          type: "integer"
        status:
          type: "string"
          enum:
            - "pending"
            - "analyzing"
            - "ready"
            - "failed"
            - "cancelled"
        requested_ref:
          type: "string"
        commit_sha:
          type: "string"
        branch:
          type: "string"
        tree_hash:
          type: "string"
        parent_version_id:
          type: "string"
          nullable: true
        stats:
          type: "object"
          additionalProperties: true
          description: "Measured analysis statistics; empty until the version is ready."
        error:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        analyzed_at:
          type: "string"
          format: "date-time"
          nullable: true
      additionalProperties: false
    Enqueued:
      type: "object"
      properties:
        version_id:
          type: "string"
        job_id:
          type: "string"
      additionalProperties: false
    Commit:
      type: "object"
      properties:
        sha:
          type: "string"
        parents:
          type: "array"
          items:
            type: "string"
        author_name:
          type: "string"
        authored_at:
          type: "string"
          format: "date-time"
          nullable: true
        committed_at:
          type: "string"
          format: "date-time"
          nullable: true
        subject:
          type: "string"
      additionalProperties: false
    Branch:
      type: "object"
      properties:
        name:
          type: "string"
        head_sha:
          type: "string"
        is_default:
          type: "boolean"
      additionalProperties: false
    DirEntry:
      type: "object"
      properties:
        name:
          type: "string"
        path:
          type: "string"
        files:
          type: "integer"
      additionalProperties: false
    SourceFile:
      type: "object"
      properties:
        path:
          type: "string"
        content_hash:
          type: "string"
        size_bytes:
          type: "integer"
        language:
          type: "string"
        category:
          type: "string"
        encoding:
          type: "string"
        is_generated:
          type: "boolean"
        is_vendored:
          type: "boolean"
        content_stored:
          type: "boolean"
        parse_status:
          type: "string"
          enum:
            - "parsed"
            - "parsed_with_errors"
            - "unsupported"
            - "skipped"
            - "failed"
        parse_detail:
          type: "string"
        change:
          type: "string"
          enum:
            - "added"
            - "modified"
            - "unchanged"
        line_count:
          type: "integer"
        symbol_count:
          type: "integer"
        diagnostic_count:
          type: "integer"
        analyzed_at:
          type: "string"
          format: "date-time"
          nullable: true
      additionalProperties: false
    Dependency:
      type: "object"
      properties:
        manifest_path:
          type: "string"
        ecosystem:
          type: "string"
        name:
          type: "string"
        requirement:
          type: "string"
        scope:
          type: "string"
      additionalProperties: false
    Reference:
      type: "object"
      properties:
        path:
          type: "string"
        line:
          type: "integer"
        col:
          type: "integer"
        kind:
          type: "string"
        text:
          type: "string"
        source_key:
          type: "string"
        outcome:
          type: "string"
        confidence:
          type: "string"
        target_key:
          type: "string"
        rule:
          type: "string"
        reason:
          type: "string"
      additionalProperties: false
    Node:
      type: "object"
      properties:
        id:
          type: "integer"
          description: "Snapshot-local id used by relationships."
        key:
          type: "string"
          description: "Stable key: repo, dir:<path>, file:<path>, sym:<path>#<qualified name>, ext:<ecosystem>:<name>."
        kind:
          type: "string"
        name:
          type: "string"
        qualified_name:
          type: "string"
        path:
          type: "string"
        start_line:
          type: "integer"
        end_line:
          type: "integer"
        signature:
          type: "string"
        doc:
          type: "string"
        exported:
          type: "boolean"
        attrs:
          type: "object"
          additionalProperties: true
      additionalProperties: false
    Edge:
      type: "object"
      properties:
        src:
          type: "integer"
        dst:
          type: "integer"
        kind:
          type: "string"
          enum:
            - "CONTAINS"
            - "IMPORTS"
            - "EXPORTS"
            - "CALLS"
            - "INSTANTIATES"
            - "EXTENDS"
            - "IMPLEMENTS"
            - "REFERENCES"
            - "DEPENDS_ON"
        confidence:
          type: "string"
          enum:
            - "confirmed"
            - "probable"
            - "inferred"
            - "unknown"
        rule:
          type: "string"
          description: "Identifier of the resolution rule that produced the relationship."
        evidence_path:
          type: "string"
        evidence_line:
          type: "integer"
        occurrences:
          type: "integer"
      additionalProperties: false
    Subgraph:
      type: "object"
      properties:
        nodes:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
        edges:
          type: "array"
          items:
            $ref: "#/components/schemas/Edge"
        truncated:
          type: "boolean"
          description: "True when a size bound cut the result short."
      additionalProperties: false
    GraphStats:
      type: "object"
      properties:
        nodes:
          type: "integer"
        edges:
          type: "integer"
        nodes_by_kind:
          type: "object"
          additionalProperties: true
        edges_by_kind:
          type: "object"
          additionalProperties: true
        edges_by_confidence:
          type: "object"
          additionalProperties: true
      additionalProperties: false
    GraphDiff:
      type: "object"
      properties:
        nodes_added:
          type: "integer"
        nodes_removed:
          type: "integer"
        nodes_changed:
          type: "integer"
        edges_added:
          type: "integer"
        edges_removed:
          type: "integer"
        added:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
        removed:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
        changed:
          type: "array"
          items:
            $ref: "#/components/schemas/Node"
        added_edges:
          type: "array"
          items:
            $ref: "#/components/schemas/EdgeKeys"
        removed_edges:
          type: "array"
          items:
            $ref: "#/components/schemas/EdgeKeys"
        truncated:
          type: "boolean"
      additionalProperties: false
    EdgeKeys:
      type: "object"
      properties:
        src:
          type: "string"
        dst:
          type: "string"
        kind:
          type: "string"
        confidence:
          type: "string"
      additionalProperties: false
    Job:
      type: "object"
      properties:
        id:
          type: "string"
        repository_id:
          type: "string"
        repository_name:
          type: "string"
        version_id:
          type: "string"
        kind:
          type: "string"
        status:
          type: "string"
          enum:
            - "queued"
            - "running"
            - "succeeded"
            - "failed"
            - "cancelled"
        priority:
          type: "integer"
        attempts:
          type: "integer"
        max_attempts:
          type: "integer"
        cancel_requested:
          type: "boolean"
        worker_id:
          type: "string"
          nullable: true
        stage:
          type: "string"
        progress:
          type: "object"
          additionalProperties: true
        error:
          type: "string"
        created_at:
          type: "string"
          format: "date-time"
        started_at:
          type: "string"
          format: "date-time"
          nullable: true
        finished_at:
          type: "string"
          format: "date-time"
          nullable: true
        updated_at:
          type: "string"
          format: "date-time"
      additionalProperties: false
    Worker:
      type: "object"
      properties:
        id:
          type: "string"
        hostname:
          type: "string"
        pid:
          type: "integer"
        version:
          type: "string"
        capabilities:
          type: "object"
          additionalProperties: true
        status:
          type: "string"
        started_at:
          type: "string"
          format: "date-time"
        last_heartbeat_at:
          type: "string"
          format: "date-time"
        jobs_completed:
          type: "integer"
        jobs_failed:
          type: "integer"
        online:
          type: "boolean"
      additionalProperties: false
    AuditEvent:
      type: "object"
      properties:
        id:
          type: "integer"
        actor_user_id:
          type: "string"
          nullable: true
        actor_email:
          type: "string"
        actor_kind:
          type: "string"
        action:
          type: "string"
        target_type:
          type: "string"
        target_id:
          type: "string"
        outcome:
          type: "string"
        ip:
          type: "string"
        request_id:
          type: "string"
        detail:
          type: "object"
          additionalProperties: true
        created_at:
          type: "string"
          format: "date-time"
      additionalProperties: false
