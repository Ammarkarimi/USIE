components:
  securitySchemes:
    session:
      type: "apiKey"
      in: "cookie"
      name: "usie_session"
    token:
      type: "http"
      scheme: "bearer"
  schemas:
    ProposeChangeRequest:
      type: "object"
      required: ["version_id", "request"]
      properties:
        version_id:
          type: "string"
          format: "uuid"
        request:
          type: "string"
          minLength: 1
          maxLength: 4000
        focus_key:
          type: "string"
          description: "Optional node key the change is about."
      additionalProperties: false
    VerifyRequest:
      type: "object"
      required: ["profile"]
      properties:
        profile:
          type: "string"
        baseline:
          type: "boolean"
          default: true
          description: "Also run the profile on the unchanged version, to compare."
      additionalProperties: false
    CodeChange:
      type: "object"
      properties:
        id:
          type: "string"
        repository_id:
          type: "string"
        version_id:
          type: "string"
        request:
          type: "string"
        focus_key:
          type: "string"
        status:
          type: "string"
          enum: ["pending", "proposed", "declined", "failed", "discarded"]
        summary:
          type: "string"
        rationale:
          type: "string"
        risks:
          type: "array"
          items:
            type: "string"
        test_plan:
          type: "array"
          items:
            type: "string"
        limitations:
          type: "array"
          items:
            type: "string"
        edits:
          type: "array"
          items:
            type: "object"
        diff:
          type: "string"
        files_changed:
          type: "integer"
        lines_added:
          type: "integer"
        lines_removed:
          type: "integer"
        impact:
          type: "object"
          description: "Change impact of the diff (see Impact); empty until proposed."
        context:
          type: "array"
          items:
            type: "object"
        provider:
          type: "string"
        model:
          type: "string"
        input_tokens:
          type: "integer"
        output_tokens:
          type: "integer"
        cache_read_tokens:
          type: "integer"
        latency_ms:
          type: "integer"
        error:
          type: "string"
        created_by:
          type: "string"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
        completed_at:
          type: "string"
          format: "date-time"
          nullable: true
    VerificationProfile:
      type: "object"
      properties:
        id:
          type: "string"
        label:
          type: "string"
        description:
          type: "string"
        requires:
          type: "array"
          items:
            type: "string"
        steps:
          type: "array"
          items:
            type: "object"
            properties:
              name:
                type: "string"
              argv:
                type: "array"
                items:
                  type: "string"
              tests:
                type: "boolean"
        detected:
          type: "boolean"
        available:
          type: "boolean"
        reason:
          type: "string"
    VerificationRun:
      type: "object"
      properties:
        id:
          type: "string"
        change_id:
          type: "string"
        version_id:
          type: "string"
        profile:
          type: "string"
        baseline:
          type: "boolean"
        status:
          type: "string"
          enum: ["queued", "running", "passed", "failed", "error", "cancelled"]
        result:
          type: "object"
          description: "Sandbox, per-step exit codes, clipped output and test counts for the baseline and the change, and tests newly failing or fixed."
        error:
          type: "string"
        created_by:
          type: "string"
          nullable: true
        created_at:
          type: "string"
          format: "date-time"
        started_at:
          type: "string"
          format: "date-time"
          nullable: true
        finished_at:
          type: "string"
          format: "date-time"
          nullable: true
    ImpactRequest:
      type: "object"
      properties:
        symbols:
          type: "array"
          maxItems: 500
          items:
            type: "string"
          description: "Node keys treated as changed."
        files:
          type: "array"
          maxItems: 500
          items:
            type: "string"
          description: "Repository paths whose declarations are all treated as changed."
        diff:
          type: "string"
          description: "Unified diff (git diff / diff -u) that applies to this version."
        base_version_id:
          type: "string"
          format: "uuid"
          description: "An earlier analyzed version of the same repository; changes since it are analyzed."
        depth:
          type: "integer"
          minimum: 1
          maximum: 6
          default: 3
        min_confidence:
          type: "string"
          enum: ["confirmed", "probable", "inferred"]
          default: "probable"
      additionalProperties: false
    ImpactNode:
      type: "object"
      properties:
        node:
          $ref: "#/components/schemas/Node"
        distance:
          type: "integer"
        confidence:
          type: "string"
          enum: ["confirmed", "probable", "inferred"]
        via:
          type: "array"
          items:
            type: "string"
          description: "Node keys from this dependent to the changed node."
        kinds:
          type: "array"
          items:
            type: "string"
          description: "Relationship kinds along via."
        test:
          type: "boolean"
    Impact:
      type: "object"
      properties:
        changed:
          type: "array"
          items:
            type: "object"
            properties:
              node:
                $ref: "#/components/schemas/Node"
              reason:
                type: "string"
        unmatched:
          type: "array"
          items:
            type: "string"
        affected:
          type: "array"
          items:
            $ref: "#/components/schemas/ImpactNode"
